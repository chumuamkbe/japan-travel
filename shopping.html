function save(){try{localStorage.setItem(KEY,JSON.stringify(items));say('已儲存在此瀏覽器。')}catch{say('儲存失敗：可能空間不足，請先匯出備份並減少照片。')}summary()}function amountFor(x){const p=yenPrices(x),unit=p.length?Number(p[p.length-1].amount)||0:0;const q=x.quantity==null||x.quantity===''?1:Math.max(0,Number(x.quantity)||0);return unit*q}
function totals(rows){return {all:rows.reduce((n,x)=>n+amountFor(x),0),bought:rows.reduce((n,x)=>n+(x.done?amountFor(x):0),0)}}
const yen=n=>'¥'+n.toLocaleString('ja-JP',{maximumFractionDigits:2});
function totalBadges(rows){const t=totals(rows);return `<span class="total-badge">已買 <b>${yen(t.bought)}</b></span><span class="total-badge">清單 <b>${yen(t.all)}</b></span>`}
function summary(){const active=items.filter(x=>!x.archived);el('summary').textContent=active.filter(x=>x.done).length+' / '+active.length+' 已買';const archived=el('filter').value==='archived';el('shopping-totals').innerHTML=`<strong>${archived?'封存區':'目前清單'}</strong>`+totalBadges(items.filter(x=>archived?x.archived:!x.archived));el('archive-view').textContent=archived?'返回清單':'封存區 · '+items.filter(x=>x.archived).length}
function field(x,k,label,type='text'){return `<label>${label}<input data-field="${k}" type="${type}" ${type==='number'?'min="0" step="any"':''} value="${esc(x[k])}"></label>`}
function storeGroup(x){const name=String(x.store||'').trim();if(/3\s*coins?|３\s*coins?/i.test(name))return '3COINS';if(/7[- ]?ELEVEN|711|7-11|セブン|全家|FamilyMart|Lawson|ローソン|超商|超市|supermarket|AEON|イオン|成城石井|ライフ|西友|まいばすけっと|サミット|OKストア/i.test(name))return '超商／超市';if(!name||/待選|待確認|未指定|其他/.test(name)&&!/3COINS|藥妝|Onitsuka/i.test(name))return '其他';if(/3coins|3coin|３coins/i.test(name))return '3COINS';if(/大創|daiso/i.test(name))return '大創';if(/無印|muji/i.test(name))return '無印良品';if(/bic\s*camera|big\s*camera/i.test(name))return 'Bic Camera';if(/seam/i.test(name))return 'SEAM GINZA';if(/唐吉|donki/i.test(name))return '唐吉訶德';if(/藥妝/.test(name))return '藥妝店';if(/Onitsuka/i.test(name))return 'Onitsuka Tiger';if(/HOTEL LOVERS/i.test(name))return 'HOTEL LOVERS';if(/御殿場/.test(name))return '御殿場 OUTLET';return name}
const comparePrices=x=>/藥妝|彩妝|電器|Bic Camera|SEAM GINZA/.test(storeGroup(x))||/SUNDRUG|松本清|cosme|loft|Yodobashi|友都八喜/i.test(x.store||'');
const cleanStore=s=>String(s||'').replace(/（[^）]*）|\([^)]*\)/g,'').trim();
for(const item of seed)item.store=cleanStore(item.store);for(const item of items)item.store=cleanStore(item.store);
const visiblePrices=x=>(x.prices||[]).map((p,i)=>({p,i})).filter(({p})=>!(/新台幣|台灣定價|NT\$/.test(p.note||'')||/圖片團購價|圖片原價/.test(p.store||'')));
function renderPrices(x){const rows=visiblePrices(x);if(!comparePrices(x)){const last=rows[rows.length-1];return `<label class="reference-price">參考價格（日圓）<div class="simple-price"><span>¥</span><input aria-label="參考價格日圓" type="number" min="0" data-reference-price value="${esc(last?.p.amount??'')}" placeholder="金額"></div></label>`}return `<div class="prices"><strong>參考價格（日圓）</strong>${rows.map(({p,i})=>`<div class="price-row compare-row" data-price="${i}"><input aria-label="店家（可手填）" data-p="store" list="price-store-options" value="${esc(/圖片|參考價|影片/.test(p.store||'')?'':p.store||'')}" placeholder="店家，可手填"><span>¥</span><input aria-label="參考價格日圓" type="number" min="0" data-p="amount" value="${esc(p.amount)}" placeholder="金額"><button aria-label="刪除此價格" data-action="remove-price">×</button></div>`).join('')}<button class="add-price-small" data-action="add-price">＋新增價格</button></div>`}
const yenPrices=x=>(x.prices||[]).filter(p=>!(/新台幣|台灣定價|NT\$/.test(p.note||'')||/圖片團購價|圖片原價/.test(p.store||''))&&Number(p.amount)>0);
const priceLabel=x=>{const p=yenPrices(x);return p.length?'¥'+Number(p[p.length-1].amount).toLocaleString():'價格待補'};
const trashIcon='<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7"/></svg>';
const renderCard=x=>`<article class="card compact-card ${x.done?'purchased':''}" data-id="${esc(x.id)}"><div class="quick-view">${photo(x.photo)?`<button type="button" class="photo-open" data-action="zoom-photo" aria-label="放大${esc(x.name)}圖片"><img loading="lazy" class="photo" src="${esc(x.photo)}" alt="${esc(x.name)}商品參考圖片"></button>`:'<div class="placeholder">暫無圖片</div>'}<div class="quick-info">${storeGroup(x)==='超商／超市'?`<span class="store-subtag">${esc(x.store)}</span>`:''}<h2>${esc(x.name)}</h2><p class="quick-price">${esc(priceLabel(x))}<small> 參考價</small></p><label class="status buy-check"><input aria-label="${esc(x.name)}已買" type="checkbox" data-field="done" ${x.done?'checked':''}><span>已買</span></label></div></div><details class="product-details"><summary>細節與紀錄</summary><div class="fields">${field(x,'name','商品名稱')}${field(x,'store','購買店家')}<label class="wide">款式／容量<textarea rows="2" data-field="variant">${esc(x.variant)}</textarea></label>${field(x,'quantity','預計數量','number')}<label class="wide">備註<textarea data-field="note">${esc(x.note)}</textarea></label>${field(x,'reference','參考連結')}</div>${url(x.reference)?`<a href="${esc(url(x.reference))}" target="_blank" rel="noopener noreferrer">參考連結 ↗</a>`:''}${renderPrices(x)}</details><button class="archive-icon" data-action="archive" title="${x.archived?'還原到清單':'封存商品'}" aria-label="${x.archived?'還原':'封存'}${esc(x.name)}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 3h18v4H3zM5 7v14h14V7"/>${x.archived?'<path d="M12 17V10m-3 3 3-3 3 3"/>':'<path d="M9 11h6"/>'}</svg></button><button class="danger delete-icon" title="刪除商品" aria-label="刪除${esc(x.name)}" data-action="delete">${trashIcon}</button></article>`;
const collapsedStores=new Set();
function render(){const opened=[...el('cards').querySelectorAll('article details[open]')].map(x=>x.closest('[data-id]').dataset.id);const f=el('filter').value;const rows=items.filter(x=>f==='archived'?x.archived:!x.archived&&(f==='all'||(f==='done'?x.done:!x.done)));const grouped=new Map();for(const x of rows){const group=storeGroup(x);if(!grouped.has(group))grouped.set(group,[]);grouped.get(group).push(x)}const groups=[...grouped.keys()].sort((a,b)=>a==='其他'?1:b==='其他'?-1:0);el('store-nav').innerHTML=groups.map((g,i)=>`<a href="#store-${i}">${esc(g)} · ${grouped.get(g).length}</a>`).join('');el('cards').innerHTML=groups.map((g,i)=>`<section class="store-section" id="store-${i}"><div class="store-title-row"><h2 class="store-heading"><button class="store-toggle" data-store-toggle="${esc(g)}" aria-expanded="${!collapsedStores.has(g)}" aria-controls="store-grid-${i}"><span aria-hidden="true">${collapsedStores.has(g)?'▶':'▼'}</span> ${esc(g)}<small>${grouped.get(g).length} 項</small></button></h2><div class="store-totals">${totalBadges(items.filter(x=>storeGroup(x)===g&&(f==='archived'?x.archived:!x.archived)))}</div></div><div class="grid" id="store-grid-${i}" ${collapsedStores.has(g)?'hidden':''}>${grouped.get(g).map(renderCard).join('')}</div></section>`).join('')||'<p class="muted">此篩選下沒有商品。</p>';for(const id of opened){const detail=el('cards').querySelector('[data-id="'+CSS.escape(id)+'"] details');if(detail)detail.open=true}summary()}
el('cards').addEventListener('change',async e=>{const card=e.target.closest('[data-id]');if(!card)return;const x=items.find(x=>x.id===card.dataset.id),t=e.target;if(t.hasAttribute('data-photo')){const file=t.files[0];if(!file)return;if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>3*1024*1024){say('請使用3MB以下的 JPG、PNG 或 WebP 圖片。');return}const reader=new FileReader();reader.onload=()=>{x.photo=reader.result;save();render()};reader.readAsDataURL(file);return}if(t.hasAttribute('data-reference-price')){const rows=visiblePrices(x),last=rows[rows.length-1];if(last)last.p.amount=t.value;else(x.prices||=[]).push({store:'',amount:t.value,note:'日圓'});save();render();return}if(t.dataset.field){x[t.dataset.field]=t.type==='checkbox'?t.checked:t.value;save();if(['name','reference','done','store','quantity'].includes(t.dataset.field))render()}if(t.dataset.p){x.prices[Number(t.closest('[data-price]').dataset.price)][t.dataset.p]=t.value;save();render()}});
el('cards').addEventListener('click',e=>{const toggle=e.target.closest('[data-store-toggle]');if(toggle){const group=toggle.dataset.storeToggle;if(collapsedStores.has(group))collapsedStores.delete(group);else collapsedStores.add(group);render();return}const a=e.target.closest('[data-action]')?.dataset.action;if(!a)return;const card=e.target.closest('[data-id]'),x=items.find(x=>x.id===card.dataset.id);if(a==='zoom-photo'){el('enlarged-photo').src=x.photo;el('enlarged-photo').alt=x.name;el('photo-caption').textContent=x.name;el('photo-viewer').showModal();document.body.style.overflow='hidden';return}if(a==='archive')x.archived=!x.archived;if(a==='delete'){if(!confirm('刪除此商品？'))return;items=items.filter(i=>i!==x)}if(a==='remove-photo')x.photo='';if(a==='add-price')(x.prices||=[]).push({store:'',amount:'',note:''});if(a==='remove-price')x.prices.splice(Number(e.target.closest('[data-price]').dataset.price),1);save();render()});
el('close-photo').onclick=()=>el('photo-viewer').close();el('photo-viewer').addEventListener('close',()=>{document.body.style.overflow='';el('enlarged-photo').removeAttribute('src')});el('photo-viewer').addEventListener('click',e=>{if(e.target===el('photo-viewer')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close()}});el('add').onclick=()=>{const added=blank();items.push(added);el('filter').value='all';save();render();el('cards').querySelector('[data-id="'+added.id+'"]').scrollIntoView({behavior:'smooth'})};el('filter').onchange=render;el('archive-view').onclick=()=>{el('filter').value=el('filter').value==='archived'?'all':'archived';render()};el('print').onclick=()=>window.print();el('export').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify({version:1,items},null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='tokyo-shopping.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
render();
