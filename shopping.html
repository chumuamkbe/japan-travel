const blank=()=>({id:crypto.randomUUID(),name:'新商品',store:'',variant:'',quantity:1,actual:'',done:false,note:'',reference:'',photo:'',prices:[]});let items=seed.map(x=>({...blank(),...x}));const el=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const url=s=>{try{const u=new URL(s);return ['https:','http:'].includes(u.protocol)?u.href:''}catch{return ''}};const photo=s=>['assets/3coins-bread-spread.png','assets/storage-chair.png','assets/storage-chair-price.png','assets/luggage-band.png','assets/caster-covers.png','assets/belt-fan.png','assets/stain-pen.png','assets/phone-case.png','assets/two-way-bag.png','assets/oil-spray.png','assets/rotating-pill-case.png','assets/flat-suitcase.png','assets/luggage-drink-holder.png','assets/multi-glasses-case.png','assets/cat-eye-pen-polish.png','assets/compression-bag.png'].includes(s)||/^data:image\/(jpeg|png|webp);base64,/.test(s||'')||url(s);function say(t){el('message').textContent=t}try{const v=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(v))items=v}catch{say('無法讀取舊紀錄，請匯入備份。')}

function save(){try{localStorage.setItem(KEY,JSON.stringify(items));say('已儲存在此瀏覽器。')}catch{say('儲存失敗：可能空間不足，請先匯出備份並減少照片。')}summary()}function summary(){el('summary').textContent=items.filter(x=>x.done).length+' / '+items.length+' 已買・實付合計 ¥'+items.reduce((n,x)=>n+(x.done?Number(x.actual)||0:0),0).toLocaleString()}
function field(x,k,label,type='text'){return `<label>${label}<input data-field="${k}" type="${type}" ${type==='number'?'min="0" step="any"':''} value="${esc(x[k])}"></label>`}

el('cards').addEventListener('change',async e=>{const card=e.target.closest('[data-id]');if(!card)return;const x=items.find(x=>x.id===card.dataset.id),t=e.target;if(t.hasAttribute('data-photo')){const file=t.files[0];if(!file)return;if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>3*1024*1024){say('請使用3MB以下的 JPG、PNG 或 WebP 圖片。');return}const reader=new FileReader();reader.onload=()=>{x.photo=reader.result;save();render()};reader.readAsDataURL(file);return}if(t.dataset.field){x[t.dataset.field]=t.type==='checkbox'?t.checked:t.value;save();if(['name','reference','done'].includes(t.dataset.field))render()}if(t.dataset.p){x.prices[Number(t.closest('[data-price]').dataset.price)][t.dataset.p]=t.value;save()}});
el('cards').addEventListener('click',e=>{const a=e.target.dataset.action;if(!a)return;const card=e.target.closest('[data-id]'),x=items.find(x=>x.id===card.dataset.id);if(a==='delete'){if(!confirm('刪除此商品？'))return;items=items.filter(i=>i!==x)}if(a==='remove-photo')x.photo='';if(a==='add-price')(x.prices||=[]).push({store:'',amount:'',note:''});if(a==='remove-price')x.prices.splice(Number(e.target.closest('[data-price]').dataset.price),1);save();render()});
el('add').onclick=()=>{items.push(blank());el('filter').value='all';save();render();el('cards').lastElementChild.scrollIntoView({behavior:'smooth'})};el('filter').onchange=render;el('print').onclick=()=>window.print();el('export').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify({version:1,items},null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='tokyo-shopping.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
el('import').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;if(f.size>12*1024*1024)throw Error();const v=JSON.parse(await f.text());if(v.version!==1||!Array.isArray(v.items)||v.items.length>200)throw Error();const clean=v.items.map(i=>{if(typeof i.name!=='string'||!Array.isArray(i.prices))throw Error();const x=blank();for(const k of ['name','store','variant','note','reference','photo','catalogId'])x[k]=typeof i[k]==='string'?i[k]:'';x.quantity=Math.max(0,Number(i.quantity)||0);x.actual=Number(i.actual)>=0?i.actual:'';x.done=i.done===true;x.prices=i.prices.slice(0,30).map(p=>({store:String(p.store||''),amount:Number(p.amount)>=0?p.amount:'',note:String(p.note||'')}));return x});if(!confirm('匯入會取代此瀏覽器目前的採購紀錄，是否繼續？'))return;items=clean;save();render()}catch{say('匯入失敗，請選擇本頁匯出的JSON備份。')}finally{e.target.value=''}};render();
</script></html>
