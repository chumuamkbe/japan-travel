const frame=document.getElementById('choices-frame'),panel=document.getElementById('choice-panel');let watcher;
frame.addEventListener('load',()=>{try{const doc=frame.contentDocument;frame.style.height='1px';if(!doc.querySelector('header h1'))doc.querySelector('header')?.remove();doc.querySelectorAll('.site-header,nav').forEach(e=>e.hidden=true);const style=doc.createElement('style');style.textContent='.site-header,nav{display:none!important}header,main,.wrap{max-width:none!important;padding-left:0!important;padding-right:0!important}body{overflow:hidden}';doc.head.append(style);if(watcher)watcher.disconnect();const resize=()=>{frame.style.height=Math.max(600,doc.body.scrollHeight)+'px'};watcher=new ResizeObserver(resize);watcher.observe(doc.body);resize();}catch(e){document.getElementById('frame-status').hidden=false;}});
function choose(page){if(!['stay','kart'].includes(page))return;document.querySelectorAll('[data-page]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.page===page)));panel.setAttribute('aria-labelledby',page+'-tab');frame.title=page==='stay'?'住宿比較':'卡丁車比較';frame.src=page+'.html?embedded=1&v=lake-20261029';history.replaceState(null,'','#'+page);}
document.querySelectorAll('[data-page]').forEach(b=>{b.addEventListener('click',()=>choose(b.dataset.page));b.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();const next=b.dataset.page==='stay'?'kart':'stay';choose(next);document.getElementById(next+'-tab').focus()}})});if(location.hash==='#kart')choose('kart');
