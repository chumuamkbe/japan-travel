function schedule(stops){let next=null;return stops.map(s=>{const start=(s.fixed||next===null)?minutes(s.start):next;const conflict=s.fixed&&next!==null&&start!==null&&start<next;const end=start!==null&&s.duration!==null?start+s.duration:null;next=end!==null&&s.travel!==null?end+s.travel:null;return {start,end,conflict}})}
function render(){const d=state.days[active];const times=schedule(d.stops);$('days').innerHTML=state.days.map((x,i)=>`<button data-day="${i}" aria-pressed="${i===active}">${esc(x.date)} 週${esc(x.week)}</button>`).join('');$('editor').innerHTML=`<h2>${esc(d.date)}（${esc(d.week)}） ${esc(d.title)}</h2><details class="daynote"><summary>原行程提醒與天氣備案</summary><ul>${d.reminders.map(n=>`<li>${esc(n)}</li>`).join('')}</ul></details>`+(d.stops.length?'':'<p class="empty">這天還沒有景點，從下方新增。</p>')+d.stops.map((s,i)=>{const t=times[i];const dest=d.stops[i+1];const nav=dest?'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(s.query||s.name)+'&destination='+encodeURIComponent(dest.query||dest.name):'';return `<article class="card" data-id="${esc(s.id)}" draggable="true"><div class="cardhead"><span class="drag" aria-hidden="true">⠿</span><span class="number">${i+1}</span><strong class="schedule">${clock(t.start)}${t.end!==null?' → '+clock(t.end):''}</strong></div>${t.conflict?'<p class="warning">固定時間早於上一段預計抵達時間，請調整或縮短前面行程。</p>':''}<div class="grid"><label class="wide">景點名稱<input data-field="name" value="${esc(s.name)}"></label><label>開始時間（空白表示待補）<input type="time" data-field="start" value="${esc(s.start)}"></label><label>停留分鐘<input type="number" min="0" max="1440" data-field="duration" value="${s.duration??''}" placeholder="待補"></label><label class="check wide"><input type="checkbox" data-field="fixed" ${s.fixed?'checked':''}>固定開始時間（預約／班次）</label><label class="wide">地址或地圖搜尋名稱<input data-field="query" value="${esc(s.query)}"></label><label class="wide">備註<textarea data-field="note">${esc(s.note)}</textarea></label></div>${s.original?`<p class="muted">原草案時段：${esc(s.original)}。未自動轉成確定時間。</p>`:''}<div class="actions"><button data-act="up" ${i===0?'disabled':''} aria-label="${esc(s.name)}往前移">↑ 前移</button><button data-act="down" ${!dest?'disabled':''} aria-label="${esc(s.name)}往後移">↓ 後移</button><button data-act="move">移到其他天</button><button data-act="delete" class="delete">刪除</button><a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.query||s.name)}" target="_blank" rel="noopener noreferrer">地圖 ↗</a></div></article>${dest?`<div class="leg" data-id="${esc(s.id)}"><div class="grid"><label>到下一站<select data-field="mode">${['待查','步行','電車／地鐵','巴士','開車','計程車','其他'].map(m=>`<option ${m===s.mode?'selected':''}>${m}</option>`).join('')}</select></label><label>交通分鐘<input type="number" data-field="travel" min="0" max="1440" value="${s.travel??''}" placeholder="待查"></label><label>路線／車次／查證備註<input data-field="route" value="${esc(s.route)}" placeholder="自行填寫，未自動查證"></label></div><a href="${nav}" target="_blank" rel="noopener noreferrer" class="muted">查這兩站的交通 ↗</a></div>`:''}`}).join('');$('undo').disabled=!history.length}
$('days').onclick=e=>{const b=e.target.closest('[data-day]');if(b){active=Number(b.dataset.day);render()}};
$('editor').addEventListener('change',e=>{const field=e.target.dataset.field;if(!field)return;const s=state.days[active].stops.find(s=>s.id===e.target.closest('[data-id]').dataset.id);const v=e.target.type==='checkbox'?e.target.checked:['duration','travel'].includes(field)?(e.target.value===''?null:Number(e.target.value)):e.target.value;if(['duration','travel'].includes(field)&&v!==null&&(!Number.isInteger(v)||v<0||v>1440)){e.target.value=s[field]??'';$('status').textContent='分鐘請填0–1440的整數。';return}checkpoint();s[field]=v;if(field==='start'&&v)s.fixed=true;save();render()});
$('editor').onclick=e=>{const b=e.target.closest('[data-act]');if(!b)return;const d=state.days[active],i=d.stops.findIndex(s=>s.id===b.closest('[data-id]').dataset.id),action=b.dataset.act;if(action==='delete'){if(!confirm('刪除這個景點？可用復原取回。'))return;checkpoint();d.stops.splice(i,1);invalidate(d)}else if(action==='move'){const answer=prompt('輸入要移到的日期，例如12/07');if(answer===null)return;const target=state.days.find(x=>x.date===answer.trim());if(!target||target===d){$('status').textContent='請輸入另一個行程日期（12/03–12/13）。';return}checkpoint();target.stops.push(d.stops.splice(i,1)[0]);invalidate(d);invalidate(target)}else{const j=i+(action==='up'?-1:1);if(j<0||j>=d.stops.length)return;checkpoint();[d.stops[i],d.stops[j]]=[d.stops[j],d.stops[i]];invalidate(d)}save('順序已修改並儲存；交通分鐘已清空，請重查。');render()};
$('editor').ondragstart=e=>{if(e.target.closest('input,textarea,select')){e.preventDefault();return}const c=e.target.closest('.card');if(c){dragId=c.dataset.id;c.classList.add('dragging');e.dataTransfer.setData('text/plain',dragId)}};
$('editor').ondragover=e=>{if(e.target.closest('.card'))e.preventDefault()};$('editor').ondragend=()=>{dragId=null;document.querySelectorAll('.dragging').forEach(x=>x.classList.remove('dragging'))};$('editor').ondrop=e=>{e.preventDefault();const c=e.target.closest('.card');if(!c||!dragId||c.dataset.id===dragId)return;const d=state.days[active],from=d.stops.findIndex(s=>s.id===dragId),to=d.stops.findIndex(s=>s.id===c.dataset.id);if(from<0||to<0)return;checkpoint();d.stops.splice(to,0,d.stops.splice(from,1)[0]);invalidate(d);save('順序已修改；交通待重查。');render()};
$('add').onclick=()=>{checkpoint();state.days[active].stops.push({id:uid(),name:'新增景點',note:'',query:'',original:'',start:'',fixed:false,duration:null,mode:'待查',travel:null,route:''});invalidate(state.days[active]);save();render()};
$('undo').onclick=()=>{if(history.length){state=JSON.parse(history.pop());save('已復原上一步。');render()}};
$('reset').onclick=()=>{if(confirm('重設今天的全部修改，回到原始草案？可復原。')){checkpoint();state.days[active]=fresh().days[active];save();render()}};
$('export').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='tokyo-trip-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);$('status').textContent='已匯出行程檔。傳給旅伴後，請對方在本頁匯入。'};
$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>2000000)throw Error('檔案超過2MB。');const next=validate(JSON.parse(await f.text()));if(!confirm('匯入會取代這台裝置目前11天的行程，可復原。確定匯入？'))return;checkpoint();state=next;save('已匯入，僅儲存在這台裝置。');render()}catch(err){$('status').textContent='匯入失敗：'+err.message}finally{e.target.value=''}};
$('latest').onclick=()=>{if(confirm('以最新公開原版取代這台裝置全部11天的編輯？建議先匯出，可用復原取回。')){checkpoint();state=fresh();save('已套用最新原版；只改這台裝置。');render()}};$('print').onclick=()=>window.print();render();$('status').textContent='編輯保存在本機；原版更新不會自動覆蓋。需更新時選「套用最新原版」，原草案模糊時段保留待補。';
</script></html>
